services:
  # FastAPI Backend Web Service
  - type: web
    name: cognodb-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COGNO_URI
        sync: false
      - key: COGNO_USER
        sync: false
      - key: COGNO_PASSWORD
        sync: false

  # React Frontend Static Site
  - type: web
    name: cognodb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cognodb-backend
          property: host
